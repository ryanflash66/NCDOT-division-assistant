<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">NCDOT Division Assistant</title>
  <desc id="desc">An overhead highway sign gantry with one panel per division: Work Zone Traffic Control (20 documents, 5,371 passages), Utilities (19 documents, 1,998 passages) and Transportation Mobility and Safety (19 documents, 5,871 passages). Ask another division's manuals and get the answer with the page it came from, or a plain "not in these documents".</desc>

  <!-- Road at night: the page and the app share this dark asphalt. -->
  <rect width="1200" height="420" rx="24" fill="#15191c"/>

  <g id="title-block" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="64" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="2" fill="#8c979d">NCDOT PILOT · CROSS-DIVISION Q&amp;A</text>
    <text x="62" y="128" font-size="60" font-weight="700" fill="#ffffff">NCDOT Division Assistant</text>
    <text x="64" y="170" font-size="24" fill="#c9d2d6">Ask another division's manuals. Get the answer with the page it came from,</text>
    <text x="64" y="202" font-size="24" fill="#c9d2d6">or a plain “not in these documents.”</text>
  </g>

  <!-- Sign gantry: one beam, two posts. -->
  <g id="gantry" fill="#4f595f">
    <rect x="34" y="232" width="1132" height="10" rx="3"/>
    <rect x="34" y="232" width="14" height="188"/>
    <rect x="1152" y="232" width="14" height="188"/>
    <rect x="150" y="242" width="6" height="12"/><rect x="316" y="242" width="6" height="12"/>
    <rect x="514" y="242" width="6" height="12"/><rect x="680" y="242" width="6" height="12"/>
    <rect x="878" y="242" width="6" height="12"/><rect x="1044" y="242" width="6" height="12"/>
  </g>

  <g id="division-panels" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <!-- Work Zone: temporary traffic control signs are orange with black legends. -->
    <g transform="translate(64 254)">
      <rect width="344" height="140" rx="14" fill="#f2811d"/>
      <rect x="6" y="6" width="332" height="128" rx="10" fill="none" stroke="#111111" stroke-width="3"/>
      <text x="24" y="50" font-size="28" font-weight="700" fill="#111111">Work Zone</text>
      <text x="24" y="84" font-size="28" font-weight="700" fill="#111111">Traffic Control</text>
      <text x="24" y="116" font-size="18" fill="#1d1d1d">20 documents · 5,371 passages</text>
      <path d="M306 42v34h-12l18 22 18-22h-12V42z" fill="#111111" transform="translate(-8 0)"/>
    </g>
    <!-- Guide signs are green with white legends. -->
    <g transform="translate(428 254)">
      <rect width="344" height="140" rx="14" fill="#0e6b3e"/>
      <rect x="6" y="6" width="332" height="128" rx="10" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="24" y="67" font-size="28" font-weight="700" fill="#ffffff">Utilities</text>
      <text x="24" y="116" font-size="18" fill="#e3efe8">19 documents · 1,998 passages</text>
      <path d="M306 42v34h-12l18 22 18-22h-12V42z" fill="#ffffff" transform="translate(-8 0)"/>
    </g>
    <g transform="translate(792 254)">
      <rect width="344" height="140" rx="14" fill="#0e6b3e"/>
      <rect x="6" y="6" width="332" height="128" rx="10" fill="none" stroke="#ffffff" stroke-width="3"/>
      <text x="24" y="50" font-size="26" font-weight="700" fill="#ffffff">Transportation</text>
      <text x="24" y="84" font-size="26" font-weight="700" fill="#ffffff">Mobility and Safety</text>
      <text x="24" y="116" font-size="18" fill="#e3efe8">19 documents · 5,871 passages</text>
      <path d="M306 42v34h-12l18 22 18-22h-12V42z" fill="#ffffff" transform="translate(-8 0)"/>
    </g>
  </g>

</svg>
