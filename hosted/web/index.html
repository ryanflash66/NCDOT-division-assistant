<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cross-Division Q&amp;A</title>
    <meta name="description" content="Prototype: ask another NCDOT division's manuals a question and get an answer with page citations." />
    <script>
      // Follow the system's dark mode, before the first paint and whenever it changes.
      (function () {
        var dark = window.matchMedia("(prefers-color-scheme: dark)");
        var apply = function () { document.documentElement.classList.toggle("dark", dark.matches); };
        apply();
        dark.addEventListener("change", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
